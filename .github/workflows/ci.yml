name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Syntax check
        run: python -m py_compile nin.py

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Lint (ruff)
        run: ruff check nin.py

      - name: Install gitleaks
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh \
            | sh -s -- -b /usr/local/bin v8.30.0

      - name: gitleaks (git history)
        run: gitleaks git .

      - name: gitleaks (working tree)
        run: gitleaks dir . -c .gitleaks.toml
