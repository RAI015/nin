name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Syntax check
        run: python -m py_compile nin.py

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Lint (ruff)
        run: ruff check nin.py

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          mkdir -p "$HOME/.local/bin"
          mv gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: gitleaks (git history)
        run: gitleaks git .

      - name: gitleaks (working tree)
        run: gitleaks dir . -c .gitleaks.toml
